[package]
name = "nokori"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "A markdown-file-based backlog management CLI"
homepage = "https://github.com/sile/nokori"
repository = "https://github.com/sile/nokori"
readme = "README.md"
keywords = ["backlog", "task-management"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "src/**/*.rs",
    "templates/**/*.md",
    "tests/**/*.rs",
]

[dependencies]
noargs = "0.4.3"
